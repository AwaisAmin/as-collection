# Local development services for apps/api.
#   docker compose up -d        start Postgres, Redis and S3-compatible storage
#   docker compose down         stop (data is kept in named volumes)
#   docker compose down -v      stop and DELETE all local data
#
# Every port binds to 127.0.0.1 only — nothing is reachable from the network.
# Credentials come from .env (copy .env.example); the defaults are for local development only.
name: as-collection

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-as_collection}
      POSTGRES_USER: ${POSTGRES_USER:-as_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-as_dev_password}
    ports:
      # Uncommon host ports: 5432/5433/6379 are often taken by other local projects.
      - '127.0.0.1:${POSTGRES_PORT:-5440}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ['no-new-privileges:true']

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    # Password-protected even locally; AOF persistence so queues survive restarts.
    command:
      ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:-as_dev_redis}']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6390}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "${REDIS_PASSWORD:-as_dev_redis}" --no-auth-warning ping | grep PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ['no-new-privileges:true']

  # S3-compatible object storage (product images, payment screenshots). Production can use
  # any S3 provider (AWS S3, Cloudflare R2, DigitalOcean Spaces) — the API only speaks S3.
  storage:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-as_dev_storage}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-as_dev_storage_secret}
    ports:
      - '127.0.0.1:${S3_PORT:-9000}:9000' # S3 API
      - '127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001' # web console
    volumes:
      - storage_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt: ['no-new-privileges:true']

  # One-off: RustFS runs as UID 10001, so the named volume must be owned by it.
  storage-permissions:
    image: alpine:3.23
    volumes:
      - storage_data:/data
    command: ['sh', '-c', 'chown -R 10001:10001 /data']
    restart: 'no'

volumes:
  postgres_data:
  redis_data:
  storage_data:
